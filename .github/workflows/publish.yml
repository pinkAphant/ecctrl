name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "2.*"
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure latest npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
